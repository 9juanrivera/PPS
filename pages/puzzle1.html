<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Puzzle 1</title>

<link rel="stylesheet" href="../css/index.css">

</head>

<body>

<div class="container">

<p id="regalo">Haz la operacion de adentro y multiplicalo por el numero superior que le sigue</p>

<h1 id="titulo">



(1+1) → 6
<br>
(1*3) → 12
<br>
(2*2) → 20
<br>
(√25) → ?

</h1>

<input
id="r"
autocomplete="off"
>

<br>

<button onclick="resolver()">
Enviar
</button>

<p id="m"></p>

<button
id="fakeButton"
onclick="caminoFalso()"
>
...
</button>

</div>

<script>

let errores = 0;

console.log(
  "El patrón nunca fue difícil."
);

function resolver(){

  let r =
  document.getElementById("r")
  .value;

  if(r == "30"){

    localStorage.setItem(
      "puzzle1",
      "completado"
    );

    window.location.href =
    "puzzle2.html";

  }

  else{

    errores++;

    document.getElementById("m")
    .innerText =
    "No entiendes el patrón.";

  }

  /* APARECE EL BOTON */

  if(errores >= 2){

    document.getElementById(
      "fakeButton"
    ).style.display =
    "inline-block";

  }

  /* GLITCH */

  if(errores >= 4){

    document.body.classList.add(
      "glitch"
    );

  }

  /* MENSAJE MAS PERSONAL */

  if(errores >= 6){

    document.getElementById(
      "m"
    ).innerText =
    "Tal vez las matemáticas no son lo tuyo.";

  }

}

/* CAMINO FALSO */

function caminoFalso(){

  document.body.innerHTML = `

  <div class="container">

    <h1>
      ¿De verdad creíste que encontrarías un atajo?
    </h1>

    <button onclick="volver()">
      Lo Descubriste
    </button>

  </div>

  `;

}

/* VOLVER */

function volver(){

  window.location.href =
  "falso1.html";

}

</script>

</body>
</html>
